---
layout: default
---
<main class="single">
    <article>
        <header class="single-header">
            <h1 class="single-title">{{ page.title }}</h1>
            {% if page.date %}<div class="single-meta">// {{ page.date | date: "%d %b %Y" }}</div>{% endif %}
            {% if page.image %}
            <figure class="single-image">
                <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
            </figure>
            {% endif %}
        </header>
        <section class="gh-content single-content">
            {{ content }}
        </section>
        <div class="back-link">
            <a href="{{ '/' | relative_url }}">&larr; back to home</a>
        </div>
    </article>
</main>
