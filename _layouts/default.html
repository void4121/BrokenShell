<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/screen.css' | relative_url }}">
    <meta name="referrer" content="no-referrer-when-downgrade">
    {% seo %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <script defer src="{{ '/public/cards.min.js' | relative_url }}"></script>
    <link rel="stylesheet" type="text/css" href="{{ '/public/cards.min.css' | relative_url }}">
    <style>:root {--ghost-accent-color: #FF1A75;}</style>
</head>
<body class="{% if page.layout == 'home' %}home-template{% elsif page.layout == 'post' %}post-template{% else %}page-template{% endif %}">

<header class="site-header">
    <a class="site-logo" href="{{ '/' | relative_url }}">[ {{ site.title }} ]<span class="cursor-blink"></span></a>
    <nav class="site-nav">
        <ul class="nav">
            <li class="nav-home{% if page.url == '/' %} nav-current{% endif %}"><a href="{{ '/' | relative_url }}">Home</a></li>
            <li class="nav-about{% if page.url == '/about/' %} nav-current{% endif %}"><a href="{{ '/about/' | relative_url }}">About</a></li>
            <li class="nav-projects{% if page.url contains '/tag/projects' %} nav-current{% endif %}"><a href="{{ '/tag/projects/' | relative_url }}">Projects</a></li>
        </ul>
    </nav>
</header>

{{ content }}

<footer class="site-footer">
    <span>// always learning</span>
</footer>

</body>
</html>
