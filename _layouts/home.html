---
layout: default
---
<section class="hero">
    <div class="hero-left">
        <p class="hero-eyebrow">// Portfolio &amp; Blog</p>
        <h1 class="hero-title">Hi, welcome and thanks for visiting my site.</h1>
        <p class="hero-desc">{{ site.description }}</p>
    </div>
    <div class="hero-art">
        <svg viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="130" height="78" rx="5" fill="#1a2035" stroke="#2d3748" stroke-width="1.5"/>
            <rect x="16" y="14" width="118" height="66" rx="3" fill="#0d1117"/>
            <rect x="22" y="22" width="52" height="8" rx="2" fill="#00ff41" opacity="0.9"/>
            <rect x="22" y="34" width="35" height="4" rx="1" fill="#2d3748"/>
            <rect x="22" y="42" width="45" height="4" rx="1" fill="#2d3748"/>
            <rect x="22" y="50" width="28" height="4" rx="1" fill="#2d3748"/>
            <rect x="84" y="22" width="44" height="54" rx="2" fill="#161b27"/>
            <rect x="88" y="26" width="12" height="5" rx="1" fill="#ff6b6b"/>
            <rect x="103" y="26" width="12" height="5" rx="1" fill="#00ff41"/>
            <rect x="118" y="26" width="8" height="5" rx="1" fill="#ffd700"/>
            <rect x="88" y="36" width="36" height="3" rx="1" fill="#2d3748"/>
            <rect x="88" y="43" width="28" height="3" rx="1" fill="#2d3748"/>
            <rect x="88" y="50" width="20" height="3" rx="1" fill="#00ff41" opacity="0.7"/>
            <rect x="88" y="57" width="32" height="3" rx="1" fill="#2d3748"/>
            <rect x="88" y="64" width="16" height="3" rx="1" fill="#00ff41" opacity="0.4"/>
            <line x1="75" y1="86" x2="75" y2="98" stroke="#2d3748" stroke-width="3"/>
            <rect x="48" y="98" width="54" height="5" rx="2" fill="#2d3748"/>
            <circle cx="155" cy="15" r="2.5" fill="#00ff41" opacity="0.5"/>
            <circle cx="162" cy="22" r="1.5" fill="#00ff41" opacity="0.3"/>
            <circle cx="15" cy="95" r="1.5" fill="#00ff41" opacity="0.3"/>
        </svg>
    </div>
</section>

<div class="section-label">// projects</div>

<main class="card-grid">
    {% for post in site.posts %}
    <a class="card" href="{{ post.url | relative_url }}">
        <div class="card-tag">[{{ post.tags | join: ", " }}]</div>
        <h2 class="card-title">{{ post.title }}</h2>
        <p class="card-excerpt">{{ post.excerpt | strip_html | strip_newlines | truncate: 160 }}</p>
    </a>
    {% endfor %}
</main>
